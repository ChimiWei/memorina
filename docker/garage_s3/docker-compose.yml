services:
  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0

    environment:
    - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
    - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
    - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET}
    
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"

    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data

    command: >
      /garage server --single-node --default-bucket

      
    networks:
      - shared-network

  garage-ui:
    image: noooste/garage-ui:latest
    container_name: garage-ui
  
    volumes:
      - ./config.yaml:/app/config.yaml
  
    depends_on:
      garage:
        condition: service_started
        
    restart: on-failure:5

    ports:
      - "3904:8080"

    environment:
      - GARAGE_UI_GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}

    networks:
      - shared-network

networks:
  shared-network:
    external: true
