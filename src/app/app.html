
<app-header></app-header>

<main class="main">
  <div class="content">
    <div class="board">
      <app-memory-card
        *ngFor="let card of cards()"
        [card]="card"
        [disabled]="isDisabled(card)"
        (cardClick)="onCardClick($event)"
      />
    </div>

    <p class="score">Pontos: {{ score() }}</p>
  </div>
</main>


<router-outlet />
