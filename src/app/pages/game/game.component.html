<app-header></app-header>

<main class="main">
  @switch (screen()) {
    @case ('menu') {
      <app-main-menu (startGame)="onMenuStart($event)" />
    }
    @case ('setup') {
      <app-card-setup
        [totalPairs]="config().totalPairs"
        [cardsPerRow]="config().cardsPerRow"
        (startWithImages)="onSetupStart($event)"
        (backToMenu)="onBackToMenu()"
      />
    }
    @case ('playing') {
      <div class="content">
        <div class="board-header">
          <button
            class="back-btn"
            (click)="onBackToMenu()"
            aria-label="Voltar ao menu"
            id="btn-back-menu"
          >← Menu</button>
          
          <div class="score-container-group">
            <app-score-display [score]="score()" class="score-display-wrapper" />
          </div>
          
          <app-game-timer
            class="game-timer-wrapper"
            [running]="isPlaying()"
            (tick)="onTimerTick($event)"
          />
        </div>

        <div
          class="board"
          [style.--cards-per-row]="config().cardsPerRow"
        >
          @for (card of cards(); track card.id) {
            <app-memory-card
              [card]="card"
              [disabled]="isDisabled(card)"
              (cardClick)="onCardClick($event)"
            />
          }
        </div>
        
        <div>
          @if (isGameOver()) {
              <button
                class="restart-btn"
                (click)="onRestart()"
                aria-label="Reiniciar o jogo"
              >
                <span class="restart-btn__icon">↻</span>
              </button>
            }
        </div>

        <div class="board-footer">
          <app-multiplier-display
            [elapsedSeconds]="elapsedSeconds()"
            [lastMatchAt]="lastMatchAt()"
          />
        </div>
      </div>
    }
  }
</main>
