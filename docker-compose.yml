version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: memorina_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: memorina
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    
    networks:
      - shared-network


networks:
  shared-network:
    external: true
    
volumes:
  mysql_data:

  
